name: Continuous Integration

# Trigger on pushes or pull requests to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Define jobs for the workflow
jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Run Linter (flake8 for PEP 8 compliance)
      - name: Lint Code
        run: |
          pip install flake8==6.1.0
          flake8 --max-line-length=88 --exclude=.git,__pycache__,migrations --ignore=E401,F401 .

      # Step 5: Run Tests (skipped gracefully when no test files exist)
      - name: Run Tests
        run: |
          pip install pytest pytest-cov
          if ls tests/test_*.py >/dev/null 2>&1 || ls test_*.py >/dev/null 2>&1; then
            pytest --cov=. --cov-report=xml --cov-report=term
          else
            echo "No tests found, skipping pytest."
          fi

      # Step 6: Upload coverage report to Codecov
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@af2ee03a4e3e11499d866845a1e6c5a11f85cf4e # v4.5.0
        with:
          fail_ci_if_error: false