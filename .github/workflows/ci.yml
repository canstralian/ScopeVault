name: Continuous Integration

# Trigger on pushes or pull requests to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Define jobs for the workflow
jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    # Services required for the application (PostgreSQL, for example)
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Run Linter (flake8 for PEP 8 compliance)
      - name: Lint Code
        run: |
          pip install flake8
          flake8 --max-line-length=88 --exclude=.git,__pycache__,migrations

      # Step 5: Run Tests (Example uses pytest)
      - name: Run Tests
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_db"
        run: |
          pip install pytest pytest-cov
          pytest --cov=app --cov-report=xml --cov-report=term

      # Step 6: Upload coverage report to codecov
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true