[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scopevault"
version = "0.1.0"
description = "Bug bounty scope enforcement and policy engine"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
scopevault = "scopevault.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["scopevault*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
